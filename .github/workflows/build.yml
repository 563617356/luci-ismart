name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release:
        description: '创建 Release 并上传 ipk/apk'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: shell 语法检查
        run: |
          set -eu
          for f in root/usr/libexec/ismart/core.sh \
                   root/usr/libexec/ismart/apply-reload.sh \
                   root/usr/libexec/ismart/guard-loop.sh \
                   root/usr/bin/ismart-ctl \
                   root/etc/init.d/ismart; do
            sh -n "$f" && echo "ok  $f"
          done

      - name: 核心逻辑测试（mock uci）
        # Windows 本机跑这套约 10 分钟（每次 uci 调用都要起一个 Python
        # 解释器做转发），Linux 上快两个数量级，这里只是兜一个超时上限。
        run: timeout 900 python3 tests/test_ismart.py

      - name: JSON 与 JS 静态检查
        run: |
          set -eu
          python3 - <<'PY'
          import json
          for p in ('root/usr/share/luci/menu.d/luci-app-ismart.json',
                    'root/usr/share/rpcd/acl.d/luci-app-ismart.json'):
              with open(p, encoding='utf-8') as f:
                  json.load(f)
              print('ok ', p)
          PY

          # LuCI 视图顶部的 'require view' / 'require uci' 是 LuCI 预处理器指令，
          # 不是合法 JS——直接 node --check 必然报 "Unexpected identifier"。
          # 先把这些指令行剥掉再检查，剩下的才是真正的 JS 语法。
          # 这样能抓到括号/字符串不配平这类必然导致页面白屏的问题。
          sed -e "s/^\s*'require [^']*'\s*;\?\s*$//" \
              -e "s/^require [^;]*;\s*$//" \
              htdocs/luci-static/resources/view/ismart/ismart.js > /tmp/ismart-stripped.js
          node --check /tmp/ismart-stripped.js
          echo 'ok  ismart.js（已剥离 LuCI require 指令）'

  build:
    name: ${{ matrix.version }} ${{ matrix.label }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SDK 文件名由下载步骤从目录索引动态发现（文件名含 gcc 版本号，
          # 且 24.10+ 用 .tar.zst、23.05- 用 .tar.xz，硬编码必然失效）。
          #
          # arch / sdk_subtarget 均已对 downloads.openwrt.org 的目录索引
          # 逐个核实存在（用两级索引：targets/ 下是顶层 vendor 目录，
          # vendor 下才是 subtarget）：
          #
          #   x86-64              所有版本
          #   armsr-armv8         23.05 起（22.03 的 targets/ 下无 armsr 目录）
          #   qualcommax-ipq807x  24.10/25.12（22.03/23.05 无 qualcommax 目录）
          #   rockchip-armv8      所有版本，22.03 的 aarch64 路线靠它
          #   mediatek-filogic    23.05 起（22.03 的 mediatek 下只有 mt762x，属 armv7）
          #
          # 注意 armsr 下只有 armv7 / armv8，没有 armv8.2 —— 别按名字猜。
          #
          # 本项目两个包都是 PKGARCH:=all，架构无关，一份包通吃所有架构。
          # 这里的 aarch64 矩阵不是为了产出 arm64 专用包，而是**验证**：
          # 万一将来误加了 x86 专属依赖，只有真机架构的 SDK 才能发现。
          # 所以 aarch64 目标的产物不进 Release，只做构建校验。
          - version: '25.12.5'
            arch: x86-64
            sdk_subtarget: x86/64
            label: x86-64
            release: true
          - version: '25.12.5'
            arch: armsr-armv8
            sdk_subtarget: armsr/armv8
            label: aarch64 (armsr-armv8)
            release: false
          - version: '25.12.5'
            arch: qualcommax-ipq807x
            sdk_subtarget: qualcommax/ipq807x
            label: aarch64 (qualcommax-ipq807x)
            release: false

          - version: '24.10.8'
            arch: x86-64
            sdk_subtarget: x86/64
            label: x86-64
            release: true
          - version: '24.10.8'
            arch: armsr-armv8
            sdk_subtarget: armsr/armv8
            label: aarch64 (armsr-armv8)
            release: false
          - version: '24.10.8'
            arch: qualcommax-ipq807x
            sdk_subtarget: qualcommax/ipq807x
            label: aarch64 (qualcommax-ipq807x)
            release: false

          - version: '23.05.6'
            arch: x86-64
            sdk_subtarget: x86/64
            label: x86-64
            release: true
          - version: '23.05.6'
            arch: armsr-armv8
            sdk_subtarget: armsr/armv8
            label: aarch64 (armsr-armv8)
            release: false

          - version: '22.03.7'
            arch: x86-64
            sdk_subtarget: x86/64
            label: x86-64
            release: true
          - version: '22.03.7'
            arch: rockchip-armv8
            sdk_subtarget: rockchip/armv8
            label: aarch64 (rockchip-armv8)
            release: false

    steps:
      - uses: actions/checkout@v4

      - name: 缓存 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: openwrt
          # 只按 SDK 坐标做 key——不混入源码 hash，否则改一行代码就重下 1GB。
          # v2：旧缓存里 feeds/ 处于 detached HEAD，会让 feeds update 必然失败，
          #     改 key 后缀强制重建。
          key: sdk-v2-${{ matrix.version }}-${{ matrix.arch }}

      - name: 恢复缓存后清理 feeds
        if: steps.sdk-cache.outputs.cache-hit == 'true'
        run: |
          set -eu
          cd openwrt
          # SDK 目录里的 feeds/base 是 SDK 自带的 git 仓库，缓存恢复后处于
          # detached HEAD（"You are not currently on a branch"），
          # ./scripts/feeds update 对它执行 git pull 会直接失败：
          #   Updating feed 'base' from '...;v24.10.8' ...
          #   You are not currently on a branch. ... failed.
          # 这与网络无关，是缓存的副作用——只有命中缓存的版本会失败。
          #
          # 处理：删掉 feeds/ 与索引缓存，feeds update 会重新 clone。
          # 只影响 update 的网络开销，不影响 SDK 本体。
          rm -rf feeds tmp/.packageinfo tmp/.config-package.in 2>/dev/null || true
          echo "feeds 已清理，feeds update 将重新拉取"

      - name: 下载并解压 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          SDK_VERSION: ${{ matrix.version }}
          SDK_SUBTARGET: ${{ matrix.sdk_subtarget }}
          SDK_ARCH: ${{ matrix.arch }}
        run: |
          set -eu

          BASE="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/${SDK_SUBTARGET}"

          # SDK 文件名随版本变化很大：
          #   24.10+ : openwrt-sdk-<ver>-<arch>_gcc-<ver>_musl.Linux-x86_64.tar.zst
          #   23.05- : openwrt-sdk-<ver>-<arch>_gcc-<ver>_musl.Linux-x86_64.tar.xz
          # 硬编码必然随 OpenWrt 升级而失效，因此从目录索引中动态发现。
          NAME="$(curl -fsSL --retry 3 "$BASE/" \
            | grep -o "openwrt-sdk-[^\"]*\.tar\.\(zst\|xz\)" \
            | grep -- "-${SDK_ARCH}_" \
            | head -n1 || true)"

          if [ -z "$NAME" ]; then
            echo "::error::在 $BASE/ 下未找到 ${SDK_ARCH} 的 SDK 包"
            echo "可访问 $BASE/ 查看实际文件名"
            exit 1
          fi

          URL="$BASE/$NAME"
          echo "SDK: $NAME"
          curl -fsSL --retry 3 -o sdk.tar "$URL"

          mkdir -p openwrt
          case "$NAME" in
            *.tar.zst) tar --zstd -xf sdk.tar -C openwrt --strip-components=1 ;;
            *.tar.xz)  tar -xJf  sdk.tar -C openwrt --strip-components=1 ;;
            *) echo "::error::未知压缩格式: $NAME"; exit 1 ;;
          esac
          rm -f sdk.tar

          test -f openwrt/Makefile || { echo "::error::SDK 解压异常"; exit 1; }
          echo "SDK 就绪"

      - name: 更新 feeds
        run: |
          set -eu
          cd openwrt
          # 仍保留重试：feeds update -a 要 clone 多个远端仓库，
          # CI 网络下偶发中断（RPC failed / HTTP 503）确有可能。
          # 但 24.10.8 长期失败的真正原因不是网络，而是缓存的 SDK 里
          # feeds/base 处于 detached HEAD（见上一步骤的清理），已单独处理。
          for attempt in 1 2 3; do
            echo "=== feeds update -a（第 $attempt 次）==="
            if ./scripts/feeds update -a; then
              echo "feeds 更新成功"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::feeds update 连续 3 次失败"
              for d in feeds/*/; do
                [ -d "$d/.git" ] || continue
                printf '%-24s ' "$d"
                git -C "$d" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "?"
              done
              exit 1
            fi
            echo "第 $attempt 次失败，20 秒后重试…"
            sleep 20
          done

      - name: 接入本仓库为内置包
        run: |
          set -eu
          cd openwrt

          # 放 package/（SDK 内置包路径），由 make 自动扫描。
          # 不用 feeds 机制的原因见 README：
          #   - 本地目录不能作 feed 源（src-git 要求 git 源）
          #   - src-link 虽可用，但 feeds 的包收集只收录走 package.mk 的包，
          #     界面包会被跳过并报 "No feed for package ... found"
          # 两个包都走标准 package.mk，make 扫描无歧义。
          rm -rf package/luci-app-ismart package/ismart-core

          # ---- 界面包 ----
          # package.mk 的 install 段按 ./htdocs ./root 相对路径取文件，
          # 因此这些目录必须与 Makefile 同级。
          mkdir -p package/luci-app-ismart
          cp "$GITHUB_WORKSPACE/luci/Makefile" package/luci-app-ismart/
          cp -r "$GITHUB_WORKSPACE/htdocs"            package/luci-app-ismart/
          cp -r "$GITHUB_WORKSPACE/root"              package/luci-app-ismart/

          # ---- 运行时主包 ----
          mkdir -p package/ismart-core
          cp "$GITHUB_WORKSPACE/Makefile" package/ismart-core/
          cp -r "$GITHUB_WORKSPACE/root"  package/ismart-core/

          echo "=== 界面包 ==="
          ls package/luci-app-ismart/
          echo "=== 主包 ==="
          ls package/ismart-core/

          # 逐项校验：Makefile 的 install 段引用了这些路径，缺一个就装不全。
          # 这类错误极难发现——编译成功、安装成功、功能全无。
          for f in \
            package/luci-app-ismart/Makefile \
            package/luci-app-ismart/htdocs/luci-static/resources/view/ismart/ismart.js \
            package/luci-app-ismart/htdocs/luci-static/resources/view/ismart/ismart.css \
            package/luci-app-ismart/root/usr/share/rpcd/acl.d/luci-app-ismart.json \
            package/luci-app-ismart/root/usr/share/luci/menu.d/luci-app-ismart.json \
            package/luci-app-ismart/root/etc/config/ismart \
            package/ismart-core/Makefile \
            package/ismart-core/root/usr/libexec/ismart/core.sh \
            package/ismart-core/root/usr/libexec/ismart/apply-reload.sh \
            package/ismart-core/root/usr/libexec/ismart/guard-loop.sh \
            package/ismart-core/root/usr/bin/ismart-ctl \
            package/ismart-core/root/etc/init.d/ismart \
            package/ismart-core/root/etc/config/ismart
          do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
          done
          echo "包文件校验通过（12 项）"

          # 换行符校验：Windows 上传时若被转成 CRLF，
          # /etc/init.d 与 /usr/bin 下的脚本会直接 "bad interpreter" 失效。
          if grep -rlU $'\r' package/luci-app-ismart package/ismart-core \
               --include='*.sh' --include='ismart-ctl' --include='ismart' 2>/dev/null; then
            echo "::error::检测到 CRLF 换行，请检查 .gitattributes"
            exit 1
          fi
          echo "换行符校验通过（无 CRLF）"

      - name: 安装 LuCI 基础依赖
        run: |
          set -eu
          cd openwrt
          # luci-base 是界面包 DEPENDS 声明的依赖，必须先 install。
          # 注意：不要用 -y —— 24.10 的 feeds 脚本不认这个选项，
          # 会报 "Unknown option: y" 并中止，导致后续包全部装不上。
          ./scripts/feeds install luci-base
          test -d package/feeds/luci/luci-base \
            || { echo "::error::luci-base 安装失败"; exit 1; }
          echo "luci-base 就绪"

      - name: 准备构建配置
        run: |
          set -eu
          cd openwrt
          # make download 依赖 .config 展开包列表；没有 .config 时
          # 新版 SDK 会遍历全部包而失败。写入最小配置并 defconfig。
          printf '%s\n' \
            'CONFIG_ALL_NONSHARED=n' \
            'CONFIG_ALL_KMODS=n' \
            'CONFIG_ALL=n' \
            'CONFIG_SIGNED_PACKAGES=n' \
            'CONFIG_DEVEL=n' \
            'CONFIG_AUTOREMOVE=n' \
            'CONFIG_BUILD_TESTING=n' \
            'CONFIG_PACKAGE_luci-app-ismart=y' \
            'CONFIG_PACKAGE_ismart-core=y' > .config
          make defconfig >/dev/null
          echo "配置条目: $(grep -c '^CONFIG_' .config || true)"

      - name: 校验包已被 make 识别
        run: |
          set -eu
          cd openwrt
          # 关键校验：确认 make 真的把本包纳入了包列表。
          # 文件存在性校验证明不了 make 认这个包——
          # 有过几轮 CI 文件检查全绿、make 却不扫这个目录的情况。
          #
          # 注意：未被选中时 .config 里是注释行
          #   # CONFIG_PACKAGE_xxx is not set
          # 因此不能只 grep '^CONFIG_PACKAGE_x='，否则会把
          # "已识别但未选中"误判成"未识别"。
          for p in luci-app-ismart ismart-core; do
            if grep -q "^CONFIG_PACKAGE_${p}=" .config; then
              echo "已启用: $(grep "^CONFIG_PACKAGE_${p}=" .config)"
            elif grep -q "^# CONFIG_PACKAGE_${p} is not set" .config; then
              echo "已识别但未选中: ${p}"
            else
              echo "::error::make 完全未识别 $p"
              echo "--- .config 中 ismart 条目 ---"
              grep -i ismart .config || echo "  (完全没有)"
              echo "--- package/ 下的本包 ---"
              ls -la package/luci-app-ismart package/ismart-core 2>/dev/null || true
              exit 1
            fi
          done

      - name: 下载依赖源码
        run: |
          set -eu
          cd openwrt
          # 只下载编译本包真正需要的依赖，避免全量拉取。
          # 先尝试整包 download（快路径），失败则退回逐包。
          if ! make package/luci-app-ismart/download \
                     package/ismart-core/download -j"$(nproc)"; then
            echo "::warning::整包 download 失败，改用全量 download"
            make download -j"$(nproc)" || {
              echo "::error::download 失败，日志尾部："
              ls -la dl/ 2>/dev/null | head -n 20 || true
              exit 1
            }
          fi
          echo "dl/ 中文件数: $(ls dl/ 2>/dev/null | wc -l)"

      - name: 编译
        run: |
          set -o pipefail
          cd openwrt
          # 编译输出留档：后面的依赖检查要从里面 grep，
          # 而依赖无效时 make 只报 WARNING 不中断，不能靠退出码判断。
          #
          # pipefail 是必须的：`cmd | tee log` 的退出码默认取 tee 的，
          # 编译失败会被吞掉、CI 照样绿灯。这里显式打开。
          make package/luci-app-ismart/compile V=s -j"$(nproc)" 2>&1 | tee /tmp/build-ui.log
          make package/ismart-core/compile    V=s -j"$(nproc)" 2>&1 | tee /tmp/build-core.log

      - name: 检查本包是否有无效依赖
        if: always()
        run: |
          set -u
          # make 对不存在的依赖只报 WARNING、不中断构建，于是「依赖写错」
          # 会一路绿灯到发布，用户装上才发现缺东西。这里当错误处理。
          #
          # 判据不能是「警告里出现过这个名字」——busybox、luci-base 这类
          # 在索引扫描早期都会报一次不存在（它们分别来自 SDK 内置与
          # feeds install），属时序噪音，据此判错会误伤。
          #
          # 正确判据是**这个依赖最终有没有被解析进 .config**：
          # 有效依赖会展开成 CONFIG_PACKAGE_<名字>=y 或 =m，
          # 无效依赖则完全不出现在 .config 里。
          #
          # .config 缺失时不能判失败——那说明前面的步骤就没跑成功，
          # 报「依赖无效」会把人带偏。
          if [ ! -f openwrt/.config ]; then
            echo "::warning::openwrt/.config 不存在，跳过依赖检查"
            exit 0
          fi
          echo "--- .config 中与本包相关的条目 ---"
          grep -E '^CONFIG_PACKAGE_(ismart|luci-app-ismart|busybox|luci-base|awk|ip-tiny|ip-full)=' \
               openwrt/.config || echo "  (无)"

          rm -f /tmp/bad-deps.txt
          for LOG in /tmp/build-ui.log /tmp/build-core.log; do
            [ -f "$LOG" ] || continue
            grep -oE "ismart[a-z-]*/Makefile' has a dependency on '[^']+'" "$LOG" 2>/dev/null \
              | sed "s/.*dependency on '//; s/'\$//" | sort -u > /tmp/deps-raw.txt
            while read -r dep; do
              [ -n "$dep" ] || continue
              dep="$(printf '%s' "$dep" | tr 'A-Z' 'a-z' | tr '_' '-')"
              if grep -qE "^CONFIG_PACKAGE_${dep}=" openwrt/.config 2>/dev/null; then
                echo "  依赖有效: $dep -> $(grep -E "^CONFIG_PACKAGE_${dep}=" openwrt/.config)"
              else
                echo "::error::Makefile 声明了无效依赖 '$dep'，它没有出现在 .config 中"
                echo "$dep" >> /tmp/bad-deps.txt
              fi
            done < /tmp/deps-raw.txt
          done
          if [ -s /tmp/bad-deps.txt ]; then
            echo "::error::无效依赖：$(sort -u /tmp/bad-deps.txt | tr '\n' ' ')"
            echo "::error::提示：awk/sed/grep 等是 busybox 的 applet，没有独立包；"
            echo "::error::      应写 +busybox 而不是 +awk"
            exit 1
          fi
          echo "依赖检查通过（本包声明的依赖均已解析进 .config）"

      - name: 收集产物
        if: always()
        env:
          IS_RELEASE: ${{ matrix.release }}
        run: |
          set -u
          OUT="$GITHUB_WORKSPACE/artifacts"
          rm -rf "$OUT"; mkdir -p "$OUT"

          # 两个包的产物都要收。ipk 形如 ismart-core_1.0.0-1_all.ipk，
          # apk 形如 ismart-core-1.0.0-r1.apk（无下划线分版本），
          # 所以两个模式都要匹配，否则 apk 会被漏掉。
          #
          # 包本身是 PKGARCH:=all，架构无关，所以**发布**产物只按 OpenWrt
          # 版本命名。早期版本把 x86-64 拼进了文件名（..._24.10.8_x86-64.ipk），
          # 会被误解成「只能装在 x86 上」，而实际上 aarch64 装的是同一个文件。
          #
          # aarch64 验证目标（IS_RELEASE=false）额外带上架构后缀，
          # 单独放到 verify/ 子目录，不进 Release——它只是用来证明
          # 「这份 all 包在 arm64 SDK 上也能构建通过」。
          VER="${{ matrix.version }}"
          ARCH_NAME=$(echo "${{ matrix.arch }}" | tr '/' '-')

          for f in $(find openwrt/bin -type f \
              \( -name 'luci-app-ismart*.ipk' -o -name 'luci-app-ismart*.apk' \
              -o -name 'ismart-core*.ipk'    -o -name 'ismart-core*.apk' \) 2>/dev/null); do
            base=$(basename "$f")
            ext="${base##*.}"
            stem="${base%.*}"
            if [ "$IS_RELEASE" = "true" ]; then
              cp "$f" "$OUT/${stem}_${VER}.${ext}"
              echo "  发布  $(basename "$f") -> ${stem}_${VER}.${ext}"
            else
              mkdir -p "$OUT/verify"
              cp "$f" "$OUT/verify/${stem}_${VER}_${ARCH_NAME}.${ext}"
              echo "  验证  $(basename "$f") -> verify/${stem}_${VER}_${ARCH_NAME}.${ext}"
            fi
          done

          echo
          echo "=== 产物 ==="
          ls -la "$OUT" || echo "  无产物"
          n=$(find "$OUT" -type f | wc -l)
          echo "共 $n 个"
          [ "$n" -ge 2 ] || echo "::warning::产物少于 2 个，可能有包未编译"

      - name: 校验产物架构标记
        if: always()
        run: |
          set -u
          # 目的：确认 PKGARCH 仍是 all，否则 aarch64 设备装不上。
          #
          # **不能靠文件名判断**：ipk 的名字里带架构段
          #（ismart-core_1.0.0-1_all.ipk），但 apk 的是
          # ismart-core-1.0.0-r1.apk —— 压根没有架构段。
          # apk 用的是 ADB 签名格式（魔数 'ADBd'），
          # 在 CI 上逐字节解析它既不 portable 也不可靠。
          #
          # 权威判据是 .config：PKGARCH:=all 会展开成
          # CONFIG_PACKAGE_<pkg>=y 且不带架构后缀，而
          # CONFIG_ALL_KMODS / TARGET_ARCH_PACKAGES 之类架构相关项不会因它而变。
          [ -f openwrt/.config ] || { echo "::warning::.config 缺失，跳过"; exit 0; }

          bad=0
          for p in luci-app-ismart ismart-core; do
            line="$(grep -E "^CONFIG_PACKAGE_${p}=" openwrt/.config || true)"
            if [ -z "$line" ]; then
              echo "::error::$p 未出现在 .config 中"
              bad=1
              continue
            fi
            case "$line" in
              *=y|*=m) echo "  $p -> $line" ;;
              *) echo "::error::$p 的取值异常：$line"; bad=1 ;;
            esac
          done

          # 反向确认：产物文件确实存在。
          # 用 -type f 而不是 -size +0：产物被 collect 步骤 cp 过来，
          # 万一某次 cp 出问题产生 0 字节文件，-size +0 会把它当「不存在」，
          # 报出与真实原因不符的错误。改成先数文件、再单独看是否有空文件。
          n=$(find "$GITHUB_WORKSPACE/artifacts" -type f \( -name '*.ipk' -o -name '*.apk' \) 2>/dev/null | wc -l)
          empty=$(find "$GITHUB_WORKSPACE/artifacts" -type f -empty \( -name '*.ipk' -o -name '*.apk' \) 2>/dev/null | wc -l)
          if [ "$n" -lt 2 ]; then
            echo "::error::产物只有 $n 个（预期至少 2）"
            bad=1
          elif [ "$empty" -gt 0 ]; then
            echo "::error::有 $empty 个产物是 0 字节，收集过程可能出错"
            bad=1
          else
            echo "  产物数：$n（均非空）"
          fi

          [ "$bad" = "0" ] && echo "产物校验通过（两包均为架构无关的 all 包）"
          exit "$bad"

      - name: 诊断
        if: always()
        run: |
          set -u
          cd openwrt 2>/dev/null || exit 0
          echo "=== OpenWrt 版本 ==="
          grep -E '^(VERSION_|SUBTARGET|TARGET_ARCHPACKAGE)' include/version.mk 2>/dev/null || true
          echo
          echo "=== feeds 状态 ==="
          for d in feeds/*/; do
            [ -d "$d/.git" ] && echo "  ok   $d" || echo "  MISS $d"
          done
          echo
          echo "=== .config 中的 ismart 条目 ==="
          grep -i ismart .config 2>/dev/null || echo "  (无)"
          echo
          echo "=== dl/ 文件数 ==="
          ls dl/ 2>/dev/null | wc -l
          echo
          echo "=== bin/ 产物 ==="
          find bin -type f \( -name '*.ipk' -o -name '*.apk' \) 2>/dev/null | head -n 10 || echo "  无"
          echo
          echo "=== 磁盘 ==="
          df -h . | tail -n1

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 发布产物与验证产物用不同前缀，Release 只取 rel-*
          name: ${{ matrix.release && 'rel' || 'verify' }}-${{ matrix.version }}-${{ matrix.arch }}
          # 用目录而不是 'artifacts/*'：
          # verify 目标的产物在 artifacts/verify/ 子目录下（见收集步骤），
          # 而 artifacts/* 这个 glob 只匹配文件、不匹配目录，
          # 两种目标的 artifact 内部结构会不一致，
          # 后面 merge-multiple 的行为也随之不同（同名摊平、
          # 不同名保留子目录），很难排查。直接传整个目录最稳。
          path: artifacts/
          # 编译失败时不额外报错，诊断步骤的输出才是关键信息
          if-no-files-found: ignore

  release:
    name: Release
    needs: build
    # 用 always()：单个版本构建失败不应阻断整个发布。
    # 完全失败时 artifacts 为空，download-artifact 与 gh-release 都会跳过，
    # 不会产生空 Release。
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release)
    runs-on: ubuntu-latest
    steps:
      # gh CLI 依赖 git 才能确定仓库与远端，即使已设 GITHUB_REPOSITORY、
      # GITHUB_TOKEN 也不行。没有 checkout 时它会报
      #   failed to run git: fatal: not a git repository
      # 并以非零退出，整个 step 挂掉。
      # 这里 checkout 只是给 gh 用（后续不读源码），很cheap。
      - uses: actions/checkout@v4

      # 只下载 rel-* 前缀的 artifact。验证产物（verify-*）用于确认
      # aarch64 也能构建，不该出现在给用户下载的 Release 里。
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          path: artifacts
          merge-multiple: true

      # 归集与发布放在同一个 step：文件路径由 shell find 出来，
      # 直接展开成多行传给 gh CLI，绕开 action-gh-release 的 glob 解析差异。
      - name: 归集产物并创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # ---- 归集 ----
          # download-artifact + merge-multiple 的目录行为并不直觉：
          # 文件名冲突时摊平到根目录，不冲突时保留各自的 artifact 子目录。
          # 所以既不能假设文件在 artifacts/ 根下，也不能用
          # `rm -f artifacts/rel-*` 去「清理」——那会把子目录连同产物删光。
          #
          # 递归收集全部包文件，不依赖目录结构。
          echo "--- 原始结构 ---"
          find artifacts -maxdepth 2 | sort | head -n 20

          mapfile -t FILES < <(find artifacts -type f \( -name '*.ipk' -o -name '*.apk' \) | sort)
          N=${#FILES[@]}
          echo "--- 产物清单（$N 个）---"
          printf '%s\n' "${FILES[@]}"

          if [ "$N" -eq 0 ]; then
            echo "::error::没有任何产物，跳过发布"
            exit 1
          fi
          # 4 个版本 × 2 个包 = 8 个文件。全失败时会远少于这个数，
          # 给出警告但不阻断（部分版本可用仍有价值）。
          if [ "$N" -lt 4 ]; then
            echo "::warning::产物仅 $N 个，预期 8 个（4 版本 × 2 包）"
          fi

          # ---- 发布 ----
          # 不用 softprops/action-gh-release：它的 files 走 @actions/glob，
          # 对「目录 + 通配符」的匹配与 shell 不一致——实测 release/*.ipk
          # 明明有 8 个文件却报 "does not match any files"。
          # gh release create 收显式路径列表，行为可预测。
          #
          # tag 重跑时 Release 已存在，gh release create 会直接报错
          # （它没有 --clobber 参数），所以先删再建。
          # 只删 Release 不删 tag —— tag 是本次 workflow 的触发源。
          #
          # 判存在必须用 API 而不是 `gh release view`：
          # 该子命令在 Release 不存在时会顺带查 git，
          # 而本 job 没有 checkout，于是报 "not a git repository" 并非零退出。
          # 放在 if 条件里虽然 stdout/stderr 被丢弃，
          # 但 set -e 下整个脚本仍会中止。API 路径不碰 git。
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
               >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，先删除再重建"
            gh api --method DELETE \
               "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${FILES[@]}"
          echo "Release 已创建: ${GITHUB_REF_NAME}"
